name: ARPEJ Alexandre Manceau

on:
  schedule:
    # Toutes les 15 minutes. GitHub met souvent la file d'attente en retard :
    # compte plutôt une vérification toutes les 15 à 40 minutes en pratique.
    - cron: "*/15 * * * *"
  workflow_dispatch: # lancement à la main depuis l'onglet Actions
    inputs:
      test_email:
        description: "Envoyer un mail de test (vérifie la config SMTP) au lieu de la vérification normale"
        type: boolean
        default: false

# Évite deux exécutions simultanées qui se marcheraient dessus sur state.json
concurrency:
  group: arpej-watch

permissions:
  contents: write # pour committer state.json entre deux exécutions

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ARPEJ_SMTP_USER: ${{ secrets.ARPEJ_SMTP_USER }}
      ARPEJ_SMTP_PASSWORD: ${{ secrets.ARPEJ_SMTP_PASSWORD }}
      ARPEJ_TO: ${{ secrets.ARPEJ_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mail de test
        if: ${{ inputs.test_email }}
        run: python arpej_watch.py --test-email

      - name: Vérifier les disponibilités
        if: ${{ !inputs.test_email }}
        run: python arpej_watch.py

      - name: Mémoriser l'état pour la prochaine exécution
        if: ${{ always() && !inputs.test_email }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
